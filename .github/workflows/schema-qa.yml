name: Shared schema database QA

on:
  workflow_call:
    inputs:
      providers-ref:
        description: Provider repository ref when called from DubUrl.Schema.
        type: string
        required: false
      schema-commit:
        description: DubUrl.Schema source commit to build and exercise.
        type: string
        required: false
      duburl-version:
        description: DubUrl package version used by the Schema caller.
        type: string
        required: false

permissions:
  contents: read

jobs:
  schema-qa:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { database: Sqlite, os: windows-latest }
          - { database: DuckDb, os: windows-latest }
          - { database: PostgreSql, os: ubuntu-latest, postgres-major: '17' }
          - { database: PostgreSql, os: ubuntu-latest, variant: '-18', postgres-major: '18', image: 'postgres:18.7@sha256:9f4fd4aa918f52ae3d6f3b687f1de90d8f867cd4d520021545a9a50c120eae3b' }
          - { database: SqlServer, os: ubuntu-latest }
          - { database: SqlServer, os: ubuntu-latest, variant: '-2025', image: 'mcr.microsoft.com/mssql/server:2025-latest@sha256:245f6b1c8903edae52cb20fa31419cefcde1a49938bb8c3447099011fc871ca3' }
          - { database: Oracle, os: ubuntu-latest }
          - { database: SingleStore, os: ubuntu-latest }
          - { database: MySql, os: ubuntu-latest }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          repository: Seddryck/DubUrl.Providers
          ref: ${{ inputs.providers-ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.401
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install defusedxml==0.7.1
      - name: Prepare Schema QA packages
        shell: pwsh
        env:
          SCHEMA_SOURCE_COMMIT: ${{ inputs.schema-commit }}
          DUBURL_DEPENDENCY_VERSION: ${{ inputs.duburl-version }}
        run: |
          $arguments = @{}
          if ($env:SCHEMA_SOURCE_COMMIT) { $arguments.SourceCommit = $env:SCHEMA_SOURCE_COMMIT }
          if ($env:DUBURL_DEPENDENCY_VERSION) { $arguments.DubUrlVersion = $env:DUBURL_DEPENDENCY_VERSION }
          ./build/Initialize-SchemaQa.ps1 @arguments
      - name: Run schema QA
        shell: pwsh
        env:
          DUBURL_DEPENDENCY_VERSION: ${{ inputs.duburl-version }}
          DUBURL_SQLSERVER_QA_IMAGE: ${{ matrix.database == 'SqlServer' && matrix.image || '' }}
          POSTGRES_IMAGE: ${{ matrix.database == 'PostgreSql' && matrix.image || '' }}
          DUBURL_POSTGRESQL_QA_MAJOR: ${{ matrix.postgres-major }}
        run: |
          $arguments = @{}
          if ($env:DUBURL_DEPENDENCY_VERSION) { $arguments.DubUrlVersion = $env:DUBURL_DEPENDENCY_VERSION }
          ./QA/Schema/run.ps1 @arguments -Database '${{ matrix.database }}'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: schema-qa-${{ matrix.database }}${{ matrix.variant }}
          path: artifacts/results/${{ matrix.database }}
          overwrite: true

  odbc-schema-qa:
    if: github.repository == 'Seddryck/DubUrl.Providers' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        fixture: [spark, hive]
    uses: ./.github/workflows/qa-spark-databricks-odbc.yml
    with:
      fixture: ${{ matrix.fixture }}
      schema-matrix: true
