name: Spark and Databricks live ODBC QA

on:
  push:
    branches: [qa/odbc-connectivity]
  workflow_dispatch:
    inputs:
      fixture:
        description: Live fixture to run
        type: choice
        options: [databricks, spark, both]
        default: both

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  databricks:
    name: Databricks Free Edition ODBC
    if: >-
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/qa/odbc-connectivity') &&
      (github.event_name == 'push' || inputs.fixture != 'spark')
    runs-on: ubuntu-24.04
    container: debian:bookworm-slim
    timeout-minutes: 30
    environment: databricks-qa
    concurrency: databricks-odbc-qa
    steps:
      - name: Install Debian runtime dependencies
        shell: bash
        run: |
          apt_options=(-o Acquire::http::Timeout=15 -o Acquire::Retries=2)
          apt-get "${apt_options[@]}" -o APT::Update::Error-Mode=any update
          apt-get "${apt_options[@]}" install -y --no-install-recommends \
            ca-certificates curl git unzip unixodbc odbcinst libicu72 libssl3 libgssapi-krb5-2 zlib1g python3
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.401'
      - name: Install pinned Databricks ODBC driver
        shell: bash
        run: |
          mkdir -p .test-results/databricks
          archive="$RUNNER_TEMP/databricks-odbc.zip"
          curl --fail --silent --show-error --location --retry 3 --retry-max-time 120 --connect-timeout 10 --max-time 60 \
            https://databricks-bi-artifacts.s3.amazonaws.com/simba-databricks-odbc-drivers/2.14.0/DatabricksODBC-2.14.0-Debian-64bit.zip \
            --output "$archive"
          echo "835f793a68e704e93a3726dc5f873140cc9d8e11a33c6c62b0400435b8d08aa8  $archive" | sha256sum --check
          unzip -q "$archive" -d "$RUNNER_TEMP/databricks-odbc"
          apt-get -o Acquire::http::Timeout=15 -o Acquire::Retries=2 install -y \
            "$RUNNER_TEMP/databricks-odbc/databricksodbc_2.14.0.1000-2_amd64.deb"
          printf '%s\n' '[Databricks ODBC Driver]' 'Driver=/opt/databricks/databricksodbc/lib/64/libdatabricksodbc64.so' > "$RUNNER_TEMP/databricks-odbc.ini"
          odbcinst -i -d -f "$RUNNER_TEMP/databricks-odbc.ini"
          odbcinst -q -d -n 'Databricks ODBC Driver' >/dev/null
          dpkg-query -W databricksodbc | tee .test-results/databricks/driver.txt
      - name: Build the pinned Schema candidate
        shell: bash
        run: |
          version=0.0.0-schema-qa.pr50
          schema_dir="$GITHUB_WORKSPACE/artifacts/schema-source"
          feed="$GITHUB_WORKSPACE/artifacts/schema-feed"
          git init "$schema_dir"
          git -C "$schema_dir" fetch --depth 1 https://github.com/Seddryck/DubUrl.Schema.git 93e16bd7e2dd59c6d905cbdd9269dd37d9aa17bb
          git -C "$schema_dir" checkout --detach FETCH_HEAD
          for project in DubUrl.Schema DubUrl.Schema.Documents; do
            dotnet pack "$schema_dir/$project" -c Release -p:Version="$version" -p:PackageIcon= -o "$feed"
          done
          echo "SchemaPackageVersion=$version" >> "$GITHUB_ENV"
      - name: Build Databricks QA
        run: dotnet build Providers/Spark/DubUrl.Provider.Databricks.QA -c Release -f net10.0
      - name: Run Databricks Free Edition shared contracts and live DDL tests
        shell: bash
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_WAREHOUSE_ID: ${{ vars.DATABRICKS_WAREHOUSE_ID }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_RESTRICTED_TOKEN: ${{ secrets.DATABRICKS_RESTRICTED_TOKEN }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import urllib.error
          import urllib.request

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None

          host = os.environ['DATABRICKS_HOST']
          warehouse = os.environ['DATABRICKS_WAREHOUSE_ID']
          if re.fullmatch(r'[a-zA-Z0-9.-]+', host) and re.fullmatch(r'[a-zA-Z0-9]+', warehouse):
              paths = {
                  'workspace principal API': '/api/2.0/preview/scim/v2/ServicePrincipals?count=1',
                  'token management API': '/api/2.0/token-management/tokens',
                  'warehouse permissions API': '/api/2.0/permissions/sql/warehouses/' + warehouse,
              }
              opener = urllib.request.build_opener(NoRedirect())
              for label, path in paths.items():
                  request = urllib.request.Request('https://' + host + path,
                      headers={'Authorization': 'Bearer ' + os.environ['DATABRICKS_TOKEN']})
                  try:
                      with opener.open(request, timeout=10) as response:
                          print(f'{label} HTTP {response.status}')
                  except urllib.error.HTTPError as error:
                      print(f'{label} HTTP {error.code}')
                  except urllib.error.URLError:
                      print(f'{label} unreachable')
          PY
          status=0
          dotnet test Providers/Spark/DubUrl.Provider.Databricks.QA -c Release -f net10.0 --no-build \
            --filter 'FullyQualifiedName~DatabricksMetadataTests|FullyQualifiedName~QualifyCatalogDefaultAfterChangingTheInsertSessionCatalog|FullyQualifiedName~DeltaRejectsNamedSequences|FullyQualifiedName~DeltaNamespaceDefaultsIgnoreTheInsertSessionSchema|FullyQualifiedName~ContextAndTimeDefaultsUseTheInsertSession|FullyQualifiedName~EvaluateColumnDefaultsOnInsert|FullyQualifiedName~InspectExportAndRedeploySchema' \
            --logger 'trx;LogFileName=databricks.trx' --results-directory .test-results/databricks || status=$?
          report=.test-results/databricks/databricks.trx
          if [[ -f "$report" ]]; then
            perl -pi -e 'for my $name (qw(DATABRICKS_TOKEN DATABRICKS_RESTRICTED_TOKEN)) { my $token = $ENV{$name}; s/\Q$token\E/[REDACTED]/g if length($token // q{}); }' "$report"
          fi
          exit "$status"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: databricks-odbc-qa
          path: .test-results/databricks
          if-no-files-found: warn

  spark:
    name: Apache Spark Thrift Server ODBC
    if: >-
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/qa/odbc-connectivity') &&
      ((github.event_name == 'push' && vars.SPARK_ODBC_DRIVER_VERSION != '') ||
       (github.event_name == 'workflow_dispatch' && inputs.fixture != 'databricks'))
    runs-on: [self-hosted, linux, x64, duburl-spark-qa]
    timeout-minutes: 20
    concurrency: spark-odbc-qa
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.401'
      - name: Run Spark shared contracts and live DDL tests
        env:
          SPARK_ODBC_DRIVER_VERSION: ${{ vars.SPARK_ODBC_DRIVER_VERSION }}
        run: bash Providers/Spark/DubUrl.Provider.Spark.QA/infrastructure/run-qa.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: spark-odbc-qa
          path: .test-results/spark
          if-no-files-found: warn
